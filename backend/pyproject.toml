[project]
name = "travai-backend"
version = "0.1.0"
description = "TravAI API: FastAPI service that runs the research and planner agents and stores results in Postgres."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.7",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/"]
